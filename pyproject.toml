[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-tracker"
version = "0.1.0"
description = "Local-first idea capture → execution system."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ganesh P", email = "ganeshp@example.com" }]
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "anthropic>=0.21.0",
    "ollama>=0.1.0",
    "streamlit>=1.28.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
idea-tracker = "idea_tracker.main:cli_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
